<!DOCTYPE html>
<html lang="bg" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <script src="portfolio-head-preinit.js"></script>
    <meta name="theme-color" content="#0f2540">
    <title>Подбрани продукти – BIOCODE Nutrition Science</title>
    <meta name="description" content="Подбрани налични продукти от BIOCODE по препоръка от вашия план.">
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://biocode-bg.com/pick.html">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="icon" type="image/png" href="images/biocode-favicon.png">
    <link rel="stylesheet" href="portfolio.css?v=20261013b">
    <style>
      .pf-pick { max-width: 1040px; margin: 0 auto; padding: 1.5rem 16px 3rem; }
      .pf-pick-head h1 { font-family: var(--pf-font-display, inherit); font-size: clamp(1.4rem, 4vw, 2rem); margin: 0 0 .35rem; }
      .pf-pick-head p { color: var(--pf-muted); margin: 0 0 1.25rem; }
      .pf-pick-grid { display: grid; grid-template-columns: minmax(0, 1fr); gap: .9rem; }
      @media (min-width: 640px) { .pf-pick-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
      .pf-pick-card .pf-card-body { gap: .35rem; }
      .pf-pick-card .pf-card-link { height: auto; }
      .pf-pick-card { display: flex; flex-direction: column; }
      .pf-pick-card .pf-pick-actions { margin-top: auto; }
      @media (max-width: 639px) {
        .pf-pick-card .pf-card-link { flex-direction: row; }
        .pf-pick-card .pf-card-image { width: 116px; height: 116px; flex: none; align-self: flex-start; }
        .pf-pick-card .pf-card-body { flex: 1; min-width: 0; }
      }
      .pf-pick-card .pf-pick-actions { padding: 0 1rem 1rem; }
      .pf-pick-badge { display: inline-block; font-size: .72rem; font-weight: 700; color: var(--pf-primary); background: var(--pf-primary-soft); border-radius: 999px; padding: .15rem .55rem; margin-bottom: .35rem; }
      .pf-pick-more { margin-top: 1.5rem; text-align: center; }
      .pf-pick-note { margin-top: 1rem; font-size: .8rem; color: var(--pf-muted); text-align: center; }
    </style>
</head>
<body class="pf-body">
    <div id="pf-header-slot"></div>
    <main class="pf-pick" id="pick-root">
        <div class="pf-pick-head">
            <h1 id="pick-title">Подбрани продукти</h1>
            <p id="pick-sub">Проверяваме наличността…</p>
        </div>
        <div class="pf-pick-grid" id="pick-grid">
            <div class="pf-loading" style="padding:3rem;text-align:center;">Зареждане…</div>
        </div>
        <div class="pf-pick-more" id="pick-more" hidden></div>
        <p class="pf-pick-note" id="pick-note" hidden></p>
    </main>
    <div id="pf-footer-slot"></div>
    <div class="pf-toast-container" id="toast-container"></div>
    <script type="module" src="portfolio-pick.js"></script>
</body>
</html>
