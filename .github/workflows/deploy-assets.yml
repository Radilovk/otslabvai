name: Deploy static assets (hero banners)

# Lightweight deploy when only images/ change — bundles new hero JPGs into Worker ASSETS.
# Full deploy.yml skips images/** to avoid catalog sync on every banner upload.

on:
  push:
    branches:
      - main
    paths:
      - 'images/**'
      - '!images/products/**'

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy-assets:
    runs-on: ubuntu-latest
    name: Deploy assets
    permissions:
      contents: read
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test hero static asset
        run: |
          BASE="https://port.radilov-k.workers.dev"
          code=$(curl -s -o /dev/null -w "%{http_code}" "${BASE}/images/portfolio-hero.jpg")
          echo "/images/portfolio-hero.jpg → HTTP ${code}"
          if [ "$code" != "200" ]; then
            echo "::error::Hero static asset smoke test failed"
            exit 1
          fi
