name: Diagnose advisors (read-only)

# Само четене: трите AI консултанта върху реалните каталози в KV, без AI извикване.
on:
  workflow_dispatch:
  push:
    branches:
      - 'ccr-**'
    paths:
      - 'scripts/diagnose-advisors.mjs'
      - '.github/workflows/diagnose-advisors.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Diagnose
        run: node scripts/diagnose-advisors.mjs
