name = "port"
main = "worker.js"
compatibility_date = "2024-04-05"
workers_dev = true

# Deploy: npm run deploy  (or GitHub Actions on push to main / cursor/*)
# Do NOT paste only worker.js in the Cloudflare dashboard — this project imports
# 20+ sibling .js modules (portfolio-api.js, protocol-quiz-engine.js, …).
# Wrangler uploads the full worker bundle from this directory.

# Set via: npx wrangler secret put FITNESS1_API_KEY
# Set via: npx wrangler secret put SILA_API_TOKEN
# Or KV keys fitness1_api_key / sila_api_token (see upload-portfolio-catalog.mjs)
# CRITICAL for multi-domain routing (daotslabna / life-protocols / biocode-bg):
# With the default asset-first mode (run_worker_first = false, sometimes shown as
# serve_directly = true in dashboard docs), Cloudflare serves index.html for "/"
# before the Worker runs — all domains then show the main site.
# run_worker_first = true forces every request through worker.js → serveMappedAsset().
# Requires Wrangler 4+ in devDependencies — Wrangler 3 silently ignores this field.
# _routes.json (include /*) is a belt-and-suspenders equivalent for static routing.
# After changing this, redeploy with `npm run deploy` (or GitHub Actions).
[assets]
directory = "."
binding = "ASSETS"
run_worker_first = true

# KV пространствата съхраняват поръчките и съдържанието на сайта.
[[kv_namespaces]]
binding = "ORDERS"
# Идентификаторите са добавени след създаване на namespace
id = "b2891ffe523048ae87cf9c4549d6ab49"
preview_id = "b2891ffe523048ae87cf9c4549d6ab49"

[[kv_namespaces]]
binding = "PAGE_CONTENT"
id = "d220db696e414b7cb3da2b19abd53d0f"
preview_id = "d220db696e414b7cb3da2b19abd53d0f"

# Wrangler REPLACES the full worker trigger set on deploy — list every host here.
# custom_domain = wrangler manages DNS (only where records were lost).
# zone routes = attach worker without touching existing DNS records.
[[routes]]
pattern = "daotslabna.com"
custom_domain = true

[[routes]]
pattern = "www.daotslabna.com"
custom_domain = true

[[routes]]
pattern = "biocode-bg.com"
custom_domain = true

[[routes]]
pattern = "www.biocode-bg.com"
custom_domain = true

[[routes]]
pattern = "life-protocols.com/*"
zone_name = "life-protocols.com"

[[routes]]
pattern = "www.life-protocols.com/*"
zone_name = "life-protocols.com"
