<!DOCTYPE html>
<html lang="bg" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0f2540">
  <link rel="icon" type="image/png" href="images/biocode-favicon.png">
  <title>AI консултант | BIOCODE Nutrition Science</title>
  <meta name="description" content="Кратък въпросник за персонален пакет или продукт от каталога с хранителни добавки.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="portfolio.css">
  <link rel="stylesheet" href="life-protocol-quiz.css?v=20260713d">
  <link rel="stylesheet" href="portfolio-advisor.css">
  <script>
    (function(){try{var s=localStorage.getItem('theme');var t=s||(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');document.documentElement.setAttribute('data-theme',t);}catch(e){document.documentElement.setAttribute('data-theme','light');}})();
  </script>
</head>
<body class="lpq-body pfa-body pf-body">
  <div id="pf-header-slot"></div>

  <main class="pfa-main">
    <a href="portfolio.html" class="lpq-back-link">← Обратно към каталога</a>
    <header class="lpq-header">
      <h1>AI консултант за добавки</h1>
      <p>Отговорете на няколко въпроса → получете персонален пакет или продуктова препоръка</p>
    </header>
    <div class="lpq-progress" aria-hidden="true"><div class="lpq-progress-fill" id="lpq-progress"></div></div>

    <div class="lpq-card" id="lpq-form-card">
      <form id="lpq-form" novalidate></form>
      <div class="lpq-nav">
        <button type="button" class="lpq-btn lpq-btn-ghost" id="lpq-prev" hidden>Назад</button>
        <button type="button" class="lpq-btn lpq-btn-primary" id="lpq-next">Напред</button>
      </div>
    </div>

    <div class="lpq-card lpq-loading" id="lpq-loading" hidden>
      <div class="lpq-loading-header">
        <div class="lpq-spinner"></div>
        <div>
          <p><strong id="lpq-loading-title">Анализираме профила ви...</strong></p>
          <p class="lpq-hint" id="lpq-loading-status">Инициализиране на AI консултант</p>
        </div>
      </div>
      <div class="lpq-analysis-progress" aria-hidden="true">
        <div class="lpq-analysis-progress-fill" id="lpq-analysis-progress"></div>
      </div>
      <div class="lpq-analysis-terminal" id="lpq-analysis-log" role="log" aria-live="polite" aria-label="Ход на анализа"></div>
    </div>
  </main>

  <div id="pf-footer-slot"></div>
  <div id="pf-mobile-cart-slot"></div>
  <div class="pf-toast-container" id="toast-container"></div>
  <script type="module">
    import { initAdvisorPage } from './portfolio-advisor-page.js';
    initAdvisorPage({ active: 'advisor' });
  </script>
  <script type="module" src="portfolio-advisor-quiz.js"></script>
</body>
</html>
